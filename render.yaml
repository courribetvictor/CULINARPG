# render.yaml — CulinaRPG · Blueprint Render (100 % gratuit)
# Docs : https://render.com/docs/blueprint-spec
#
# Base de données : Neon.tech PostgreSQL gratuit (0,5 Go, https://neon.tech)
#   1. Créer un projet sur neon.tech → copier la "Connection string" (format postgresql://…)
#   2. Pusher ce dépôt sur GitHub / GitLab
#   3. Render Dashboard → New → Blueprint → sélectionner le dépôt
#   4. Renseigner DATABASE_URL, APP_URL (et Stripe si besoin) dans
#      Dashboard → culinarpg → Environment

services:
  - type: web
    name: culinarpg
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # Neon.tech : postgresql://USER:PASS@HOST/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # URL publique — à renseigner APRÈS le premier déploiement : https://<nom>.onrender.com
      - key: APP_URL
        sync: false

      # Stripe — laisser vide pour rester en mode simulation (aucun paiement réel)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Sécurité : obligatoire derrière le reverse proxy HTTPS de Render
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"

      # Optionnel
      - key: SIGNUP_CODE
        sync: false   # code d'invitation pour s'inscrire (vide = inscriptions ouvertes)
      - key: CONTACT_EMAIL
        sync: false   # e-mail affiché sur la page /privacy
      - key: PRO_USERNAMES
        sync: false   # usernames Pro permanents séparés par virgule (ex: viccrr,arthur.ddag,comptedexamen)
