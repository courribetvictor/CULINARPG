<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f97316" />
  <meta name="description" content="CulinaRPG — monte en niveau en cuisinant. 500 recettes, 5 compétences, des quêtes quotidiennes." />
  <title>CulinaRPG</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CulinaRPG" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      future: { hoverOnlyWhenSupported: true },
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
            display: ['"Playfair Display"', 'Georgia', 'serif'],
          },
          colors: { brand: '#f97316' },
        },
      },
    };
  </script>

  <!-- Lucide Icons + Canvas Confetti -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root { color-scheme: light; --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
    html, body { background: #fafaf9; }
    body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; color: #1c1917; }
    button, a, label, [role="button"] { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    input, textarea, select { font-size: 16px; }
    ::selection { background: rgba(249,115,22,.18); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(120,113,108,.2); border-radius: 999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .pt-safe { padding-top: max(.75rem, var(--sat)); }
    .pb-safe { padding-bottom: max(.5rem, var(--sab)); }

    /* White cards (remplace glass morphism) */
    .glass { background: white; border: 1px solid #e7e5e4; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .glass-strong { background: white; border: 1px solid #d6d3d1; box-shadow: 0 2px 16px rgba(0,0,0,.07); }

    /* Flamme streak */
    @keyframes flicker {
      0%, 100% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 5px rgba(251,146,60,.8)); }
      25% { transform: scale(1.12) rotate(3deg); filter: drop-shadow(0 0 10px rgba(251,191,36,.9)); }
      50% { transform: scale(.96) rotate(-3deg); filter: drop-shadow(0 0 7px rgba(249,115,22,.8)); }
      75% { transform: scale(1.08) rotate(2deg); filter: drop-shadow(0 0 12px rgba(251,146,60,1)); }
    }
    .flame { display: inline-block; animation: flicker 1.4s ease-in-out infinite; transform-origin: 50% 90%; }
    .flame-off { filter: grayscale(1) opacity(.4); animation: none; }

    /* Barres de progression */
    .bar-fill { transition: width 1.1s cubic-bezier(.22, 1, .36, 1); position: relative; overflow: hidden; }
    .bar-fill::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: sweep 2.8s ease-in-out infinite; }
    @keyframes sweep { 60%, 100% { transform: translateX(100%); } }

    /* Hover card */
    .recipe-card { transition: transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s cubic-bezier(.22,1,.36,1) !important; }
    @media (hover: hover) {
      .recipe-card:hover { transform: translateY(-4px) !important; box-shadow: 0 12px 32px rgba(0,0,0,.12) !important; }
    }

    /* Entrées / sorties */
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    .rise { animation: rise .5s cubic-bezier(.22, 1, .36, 1) both; }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
    .pop { animation: pop .6s cubic-bezier(.34, 1.56, .64, 1) both; }
    @keyframes modal-in { from { opacity: 0; transform: translateY(30px) scale(.92); } to { opacity: 1; transform: none; } }
    .modal-in { animation: modal-in .5s cubic-bezier(.22, 1, .36, 1) both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fade-in .25s ease both; }
    @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-up { animation: sheet-up .42s cubic-bezier(.22, 1, .36, 1) both; }
    @keyframes page-in { from { transform: translateX(100%); } to { transform: none; } }
    .page-in { animation: page-in .38s cubic-bezier(.22, 1, .36, 1) both; }
    @media (min-width: 640px) { .sheet-up { animation: modal-in .45s cubic-bezier(.22, 1, .36, 1) both; } }

    /* Coche animée */
    .check-path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .45s cubic-bezier(.65, 0, .45, 1) .1s; }
    .done .check-path { stroke-dashoffset: 0; }
    @keyframes ring-burst { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.7); } 100% { box-shadow: 0 0 0 18px rgba(52,211,153,0); } }
    .burst { animation: ring-burst .7s ease-out; }

    /* XP flottant */
    @keyframes float-up { 0% { opacity: 0; transform: translate(-50%, 0) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
    .xp-float { position: fixed; pointer-events: none; z-index: 90; font-weight: 800; animation: float-up 1.3s ease-out forwards; }

    @keyframes float-y { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .float-y { animation: float-y 4s ease-in-out infinite; }

    /* Skeleton clair */
    .skeleton { background: linear-gradient(90deg, #f5f5f4 25%, #e7e5e4 37%, #f5f5f4 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; border-radius: .75rem; }
    @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

    .img-zoom { transition: transform .7s cubic-bezier(.22, 1, .36, 1); }
    @media (hover: hover) { .group:hover .img-zoom { transform: scale(1.08); } }
    .press { transition: transform .15s ease; }
    .press:active { transform: scale(.96); }

    .pulse-glow { animation: none; }
    .text-glow { text-shadow: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body class="font-sans text-stone-900 min-h-[100dvh] bg-stone-50">

  <!-- Écrans plein écran (connexion, onboarding, chargement) -->
  <div id="screen" class="relative z-10"></div>

  <!-- ============ APPLICATION ============ -->
  <div id="shell" class="hidden">

    <!-- Header -->
    <header class="fixed top-0 inset-x-0 z-40 px-3 sm:px-6 pt-safe">
      <div class="bg-white border border-stone-200 shadow-[0_2px_12px_rgba(0,0,0,.06)] mx-auto max-w-6xl rounded-2xl px-3 sm:px-5 py-2.5 flex items-center gap-3">
        <button id="hdr-avatar" class="relative shrink-0 press" data-open="account" aria-label="Mon compte">
          <div id="hdr-ring" class="w-11 h-11 rounded-full p-[2px]" style="background: conic-gradient(#f97316 0%, #e7e5e4 0%);">
            <div id="hdr-avatar-inner" class="w-full h-full rounded-full overflow-hidden bg-stone-100"></div>
          </div>
          <span id="hdr-level-badge" class="absolute -bottom-1 -right-1 min-w-[22px] h-[22px] px-1 rounded-full bg-orange-500 text-white text-[11px] font-extrabold grid place-items-center border-2 border-white shadow-sm">1</span>
        </button>
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-2 min-w-0">
            <span id="hdr-name" class="font-bold tracking-tight text-stone-800 truncate"></span>
            <span id="hdr-title" class="text-[11px] font-semibold text-orange-500 truncate"></span>
          </div>
          <div class="mt-1.5 flex items-center gap-2">
            <div class="relative flex-1 h-2 rounded-full bg-stone-100 overflow-hidden">
              <div id="hdr-xp-bar" class="bar-fill h-full rounded-full bg-gradient-to-r from-orange-400 to-orange-500" style="width:0%"></div>
            </div>
            <span id="hdr-xp-text" class="text-[10px] font-bold text-stone-400 tabular-nums whitespace-nowrap"></span>
          </div>
        </div>
        <div class="shrink-0 flex items-center gap-2">
          <button id="hdr-gems" data-open="gem-shop" class="press flex items-center gap-1 rounded-xl px-2 py-1.5 bg-cyan-50 border border-cyan-200 hover:bg-cyan-100 transition-colors" aria-label="Boutique de gemmes">
            <span class="text-base leading-none">💎</span>
            <span id="hdr-gems-count" class="text-sm font-extrabold tabular-nums text-cyan-700 leading-none">0</span>
          </button>
          <div id="hdr-streak" class="flex items-center gap-1.5 rounded-xl px-2.5 py-1.5 bg-orange-50 border border-orange-200">
            <span id="hdr-flame" class="flame text-xl leading-none">🔥</span>
            <span id="hdr-streak-count" class="text-lg font-extrabold tabular-nums text-orange-600 leading-none">0</span>
          </div>
        </div>
      </div>
    </header>

    <main id="app" class="relative z-10 mx-auto max-w-6xl px-4 sm:px-6 pb-32" style="padding-top: calc(max(.75rem, env(safe-area-inset-top)) + 5.25rem)"></main>

    <!-- Navigation basse -->
    <nav class="fixed bottom-0 inset-x-0 z-40 sm:bottom-4 sm:flex sm:justify-center sm:px-4">
      <div class="bg-white border-t border-stone-200 sm:border sm:rounded-2xl relative grid grid-cols-6 sm:flex sm:gap-1 px-0.5 pt-1.5 pb-safe sm:p-1.5 shadow-[0_-2px_12px_rgba(0,0,0,.05)] sm:shadow-[0_8px_24px_rgba(0,0,0,.1)]">
        <span id="nav-indicator" class="hidden sm:block absolute top-1.5 bottom-1.5 rounded-xl bg-orange-500 transition-all duration-500 ease-[cubic-bezier(.22,1,.36,1)]"></span>
        <button data-tab="profile" class="nav-btn press relative z-10 flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 py-1 sm:px-5 sm:py-3 rounded-xl font-semibold text-[9px] sm:text-sm transition-colors duration-300">
          <span class="nav-ico grid place-items-center w-8 h-7 sm:w-auto sm:h-auto rounded-full transition-all duration-300"><i data-lucide="user-round" class="w-5 h-5"></i></span><span class="truncate">Profil</span>
        </button>
        <button data-tab="dailies" class="nav-btn press relative z-10 flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 py-1 sm:px-5 sm:py-3 rounded-xl font-semibold text-[9px] sm:text-sm transition-colors duration-300">
          <span class="nav-ico relative grid place-items-center w-8 h-7 sm:w-auto sm:h-auto rounded-full transition-all duration-300"><i data-lucide="zap" class="w-5 h-5"></i>
            <span id="nav-dailies-dot" class="hidden absolute top-0 right-1 sm:-top-1 sm:-right-1 w-2 h-2 rounded-full bg-orange-500"></span></span><span class="truncate">Dailies</span>
        </button>
        <button data-tab="recipes" class="nav-btn press relative z-10 flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 py-1 sm:px-5 sm:py-3 rounded-xl font-semibold text-[9px] sm:text-sm transition-colors duration-300">
          <span class="nav-ico grid place-items-center w-8 h-7 sm:w-auto sm:h-auto rounded-full transition-all duration-300"><i data-lucide="book-open" class="w-5 h-5"></i></span><span class="truncate">Recettes</span>
        </button>
        <button data-tab="lessons" class="nav-btn press relative z-10 flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 py-1 sm:px-5 sm:py-3 rounded-xl font-semibold text-[9px] sm:text-sm transition-colors duration-300">
          <span class="nav-ico grid place-items-center w-8 h-7 sm:w-auto sm:h-auto rounded-full transition-all duration-300"><i data-lucide="graduation-cap" class="w-5 h-5"></i></span><span class="truncate">Leçons</span>
        </button>
        <button data-tab="ranked" class="nav-btn press relative z-10 flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 py-1 sm:px-5 sm:py-3 rounded-xl font-semibold text-[9px] sm:text-sm transition-colors duration-300">
          <span class="nav-ico grid place-items-center w-8 h-7 sm:w-auto sm:h-auto rounded-full transition-all duration-300"><i data-lucide="trophy" class="w-5 h-5"></i></span><span class="truncate">Classement</span>
        </button>
        <button data-tab="pro" class="nav-btn press relative z-10 flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 py-1 sm:px-5 sm:py-3 rounded-xl font-semibold text-[9px] sm:text-sm transition-colors duration-300">
          <span class="nav-ico grid place-items-center w-8 h-7 sm:w-auto sm:h-auto rounded-full transition-all duration-300"><i data-lucide="star" class="w-5 h-5"></i></span><span class="truncate">Pro</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Couches : page plein écran, bottom sheet, modale, toasts -->
  <div id="page-root"></div>
  <div id="sheet-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed inset-x-0 z-[95] flex flex-col items-center gap-2 pointer-events-none px-4" style="top: calc(max(.75rem, env(safe-area-inset-top)) + 5rem)"></div>

  <script src="/app.js"></script>
</body>
</html>
